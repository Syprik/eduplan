<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>eduplan — офлайн</title>
    <meta name="theme-color" content="#090b14">
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="eduplan">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Иконки -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

    <style>
      :root {
        --bg: #090b14;
        --card: linear-gradient(135deg, rgba(32, 38, 66, 0.45) 0%, rgba(16, 20, 38, 0.3) 100%);
        --text: #f0f3fa;
        --muted: #95a1be;
        --accent: #8e61ff;
        --grad: linear-gradient(135deg, #8e61ff 0%, #5b36f5 100%);
        --glow: rgba(142, 97, 255, 0.4);
        --border: rgba(255, 255, 255, 0.22);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        overflow: hidden;
        position: relative;
      }
      .liquid-mesh {
        position: fixed;
        top: -30%; left: -30%; width: 160%; height: 160%;
        z-index: -1; pointer-events: none; filter: blur(65px) saturate(140%);
        background:
          radial-gradient(circle at 30% 30%, var(--accent) 0%, transparent 45%),
          radial-gradient(circle at 70% 70%, #5b36f5 0%, transparent 45%);
        opacity: 0.35;
      }
      .card {
        width: min(92vw, 420px);
        padding: 32px 24px;
        border: 1px solid var(--border);
        background: var(--card);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-radius: 20px;
        box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.28), 0 16px 40px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .icon-box {
        font-size: 44px;
        margin-bottom: 12px;
        color: var(--accent);
        filter: drop-shadow(0 0 10px var(--glow));
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 13.5px;
      }
      .btn {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 18px;
        border-radius: 12px;
        background: var(--grad);
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        font-size: 14.5px;
        border: none;
        cursor: pointer;
        box-shadow: 0 6px 20px var(--glow);
        transition: transform 0.2s;
      }
      .btn:active { transform: scale(0.97); }
      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="liquid-mesh"></div>
    <main class="card">
      <div class="icon-box">❖</div>
      <h1>нет подключения</h1>
      <p>проверьте интернет-соединение. как только сеть появится, вы сможете продолжить работу.</p>
      
      <button id="reloadBtn" class="btn" onclick="tryReload()">обновить страницу</button>
      
      <div class="hint">если интернет появился — нажмите кнопку выше, чтобы вернуться в планировщик.</div>
    </main>

    <script>
      function tryReload() {
        if (navigator.onLine) {
          window.location.href = './index.html';
        } else {
          location.reload();
        }
      }

      window.addEventListener('online', () => {
        window.location.href = './index.html';
      });
    </script>
  </body>
</html>
