<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eduplan — офлайн</title>
    <meta name="theme-color" content="#090b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="eduplan">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%238e61ff'/%3E%3Ctext%20x='50'%20y='68'%20font-size='60'%20text-anchor='middle'%20fill='%23fff'%3E%E2%9D%96%3C/text%3E%3C/svg%3E">
    <style>
      :root {
        --bg: #090b14;
        --card: rgba(22, 27, 46, 0.7);
        --text: #f0f3fa;
        --muted: #95a1be;
        --accent: #8e61ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .card {
        width: min(90vw, 440px);
        padding: 24px 20px;
        border: 1px solid rgba(255,255,255,0.12);
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 14px 30px rgba(0,0,0,0.28);
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 2.6rem); }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      .btn {
        margin-top: 18px; display: inline-block; padding: 10px 16px; border-radius: 10px;
        background: var(--accent); color: #fff; text-decoration: none; font-weight: 800;
      }
      .hint { margin-top: 12px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Нет подключения</h1>
      <p>Проверьте интернет-соединение и откройте приложение позже.</p>
      <a id="openApp" class="btn" href="/">Открыть приложение</a>
      <div class="hint">Если вы уже устанавливали приложение как PWA — откройте значок на рабочем столе.</div>
    </main>

    <script>
      // Если устройство онлайн — предложим перейти в основное приложение.
      function updateOnlineStatus() {
        const btn = document.getElementById('openApp');
        if (navigator.onLine) {
          btn.style.display = 'inline-block';
        } else {
          btn.style.display = 'none';
        }
      }
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();

      // Для iOS: при запуске страницы в standalone-режиме скрываем кнопку (уже внутри PWA)
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        const btn = document.getElementById('openApp');
        if (btn) btn.style.display = 'none';
      }
    </script>
  </body>
</html>
