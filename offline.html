<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>eduplan — офлайн</title>
    <meta name="theme-color" content="#090b14">
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="eduplan">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Иконка для экрана «Домой» на iOS (Safari требует растровый PNG, SVG не подходит) -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

    <style>
      :root {
        --bg: #090b14;
        --card: rgba(22, 27, 46, 0.75);
        --text: #f0f3fa;
        --muted: #95a1be;
        --accent: #8e61ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      }
      .card {
        width: min(92vw, 420px);
        padding: 32px 24px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        text-align: center;
      }
      .icon-box {
        font-size: 48px;
        margin-bottom: 12px;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        font-size: 14px;
      }
      .btn {
        margin-top: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 18px;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        font-size: 15px;
        border: none;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(142, 97, 255, 0.35);
      }
      .btn:active { transform: scale(0.97); }
      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon-box">❖</div>
      <h1>Нет подключения</h1>
      <p>Проверьте интернет-соединение. Как только сеть появится, вы сможете продолжить работу.</p>
      
      <button id="reloadBtn" class="btn" onclick="tryReload()">Обновить страницу</button>
      
      <div class="hint">Если интернет появился — нажмите кнопку выше, чтобы вернуться в планировщик.</div>
    </main>

    <script>
      function tryReload() {
        if (navigator.onLine) {
          window.location.href = './index.html';
        } else {
          location.reload();
        }
      }

      window.addEventListener('online', () => {
        // Как только интернет вернулся — мгновенно возвращаемся в приложение
        window.location.href = './index.html';
      });
    </script>
  </body>
</html>
